name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website for project Pages URL
        run: |
          mkdir public
          cp -R site/. public/
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const prefix = '/yetAnother/';
          function rewrite(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) rewrite(p);
              else if (/\.(html|css|js)$/i.test(entry.name)) {
                const input = fs.readFileSync(p, 'utf8');
                fs.writeFileSync(p, input.replace(/(href|src)=(['"])\/(?!\/)/g, (m, a, q) => a + '=' + q + prefix));
              }
            }
          }
          rewrite('public');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
